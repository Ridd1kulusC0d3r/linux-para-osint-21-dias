name: Testes do curso

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda: detecta ferramenta que mudou de comportamento

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Instalar ferramentas
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash ferramentas/instalar_tudo.sh completo

      - name: Rodar todos os dias (offline)
        run: bash ferramentas/testar_tudo.sh
